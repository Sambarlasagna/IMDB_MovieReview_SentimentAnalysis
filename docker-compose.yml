services:

  # ── PostgreSQL database ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       movie_reviews
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: jaya
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movie_reviews"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── FastAPI backend (CNN model + API) ───────────────────────────
  backend:
    build:
      context: .                    # project root — gives access to CNNModel.pt
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     movie_reviews
      DB_USER:     postgres
      DB_PASSWORD: jaya
    expose:
      - "8000"                      # internal only — nginx proxies to it
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy  # wait until Postgres is ready

  # ── React frontend served by nginx ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"                     # http://localhost  → the whole site
    depends_on:
      - backend

volumes:
  postgres_data:                    # persistent DB storage across restarts