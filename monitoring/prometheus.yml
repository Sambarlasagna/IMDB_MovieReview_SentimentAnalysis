global:
  scrape_interval: 15s
  #every 15 secs evaluate the alert rules i defined in alert.rules.yml
  evaluation_interval: 15s

scrape_configs:

  # FastAPI app metrics (auto + custom)
  - job_name: "cinescope-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # PostgreSQL metrics
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Host / container system metrics
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Nginx frontend metrics
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
